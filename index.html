<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naukri Job Scraper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .top {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: #0073e6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #005bb5;
        }

        #jobs {
            max-width: 1000px;
            margin: auto;
        }

        .job {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .job h2 {
            color: #0073e6;
            margin-top: 0;
        }

        .job p {
            margin: 8px 0;
            color: #555;
        }

        .job a {
            display: inline-block;
            margin-top: 10px;
            background: #28a745;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        #status {
            text-align: center;
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🚀 Naukri Job Scraper</h1>

    <div class="top">
        <p>Python + Playwright Job Scraping Project</p>

        <button onclick="loginToNaukri()">
            Login to Naukri
        </button>
    </div>

    <div id="status">
        Loading jobs...
    </div>

    <div id="jobs"></div>

    <script>

        function loginToNaukri() {
            window.open(
                "https://www.naukri.com/",
                "_blank"
            );
        }

        async function loadJobs() {

            try {

                const response = await fetch("/api");

                const data = await response.json();

                const jobsContainer = document.getElementById("jobs");

                document.getElementById("status").innerText =
                    "Total Jobs: " + data.total_jobs;

                jobsContainer.innerHTML = "";

                data.jobs.forEach((job, index) => {

                    const jobDiv = document.createElement("div");

                    jobDiv.className = "job";

                    jobDiv.innerHTML = `
                        <h2>${index + 1}. ${job["Title"] || "No Title"}</h2>

                        <p><b>Company:</b> ${job["Company"] || "N/A"}</p>

                        <p><b>Location:</b> ${job["Location"] || "N/A"}</p>

                        <p><b>Experience:</b> ${job["Experience"] || "N/A"}</p>

                        <p><b>Skills:</b> ${job["Skills"] || "N/A"}</p>

                        <p><b>Posted:</b> ${job["Posted Date"] || "N/A"}</p>

                        <a href="${job["Job URL"]}" target="_blank">
                            View Job
                        </a>
                    `;

                    jobsContainer.appendChild(jobDiv);

                });

            } catch (error) {

                document.getElementById("status").innerText =
                    "Unable to load jobs.";

                console.error(error);
            }
        }

        loadJobs();

    </script>

</body>
</html>
